version: "3.9"

services:

  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - auraflux_network

  consultant:
    build:
      context: .
      dockerfile: apps/consultant/Dockerfile
    image: auraflux-consultant:latest
    container_name: auraflux_beacon
    ports:
      - "5173:5173"
    # env_file:
    #   - ./docker-var.env
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - auraflux_network

volumes:
  auraflux_data:

networks:
  auraflux_network:
    name: auraflux_network
    external: true
